<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SimpleMeals</title>
<meta name="theme-color" content="#14503A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  Google Analytics is intentionally not loaded here. It only starts once
  the person accepts the cookie notice, from app.js — see loadGA() and
  <ConsentBanner> there. Loading it unconditionally in <head> would mean
  it's already running by the time anyone sees the notice, which defeats
  the point of asking first.
-->

<style>
:root{
  --paper:#F4F5F3;
  --card:#FFFFFF;
  --ink:#172420;
  --brand:#1F6E4E;
  --brand-deep:#14503A;
  --accent:#E8B33C;
  --muted:#6E7A73;
  --line:#DCE2DA;
  --danger:#A6412F;

  /* Pantry status colors — deliberately their own fixed tokens, never
     the themeable --brand/--accent. A household can recolor the whole
     app, but "plenty/low/out" needs to keep meaning the same thing
     regardless, the way a traffic light doesn't get repainted purple. */
  --status-plenty:#1F6E4E;
  --status-low:#E8B33C;
  --status-out:#A6412F;

  /* Same value as --brand-deep by default — this only diverges in dark
     mode, where dark-green text needs to become light-green text.
     --brand-deep itself stays untouched because it's also used as a
     *background* (topbar, headers), which is fine dark-on-dark; text
     and background turned out to need to move independently. */
  --brand-text:var(--brand-deep);

  /* Subtle tinted surfaces — hover states, "you have this" tags, notice
     banners, the selected day. All hardcoded hex before this, which is
     exactly why they turned into light patches the first time this app
     was actually used in dark mode: a fixed light color has no way to
     know dark mode exists. */
  --tint:#EDF1EC;
  --tint-strong:#E7EDE6;
  --tint-amber:#FBF4E2;
  --tint-amber-hover:#F7EDD2;
  --tint-amber-text:#7A5B12;
  --tint-red:#F8EBE7;

  --sign:"Barlow Condensed",Impact,sans-serif;
  --body:"Instrument Sans",system-ui,sans-serif;
  --num:"IBM Plex Mono",ui-monospace,monospace;

  --r:10px;
  --pad:16px;
  color-scheme:light;
}

/* Dark mode. Redefines the neutral surface tokens only — --brand,
   --brand-deep, --accent, and every --status-* stay exactly what they
   were, so a household's chosen color and the pantry's plenty/low/out
   colors read the same in both modes. Toggled via a data-theme
   attribute on <html>, set from app.js. */
:root[data-theme="dark"]{
  --paper:#12160F;
  --card:#1B221A;
  --ink:#E8ECE4;
  --muted:#8B9986;
  --line:#333F30;
  --brand-text:color-mix(in srgb, var(--brand) 55%, white 45%);
  --tint:#212B1E;
  --tint-strong:#283428;
  --tint-amber:#332B14;
  --tint-amber-hover:#3D3419;
  --tint-amber-text:#E8C580;
  --tint-red:#3A2420;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- signage type ---------- */
.sign{
  font-family:var(--sign);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.09em;
  line-height:1;
}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* ---------- chrome ---------- */
.topbar{
  background:var(--brand-deep);
  color:#F2F7F3;
  padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 12px;
  display:flex;align-items:baseline;gap:10px;
}
.wordmark{font-family:var(--sign);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase}
.wordmark em{font-style:normal;color:var(--accent)}
.topbar .who{margin-left:auto;font-size:13px;opacity:.75;letter-spacing:.02em}
.topbar .who button{
  background:none;border:0;color:inherit;text-decoration:underline;
  cursor:pointer;padding:0 0 0 10px;font-size:13px;
}
.topbar .who .hname{
  text-decoration:underline;text-decoration-style:dotted;
  text-underline-offset:3px;cursor:pointer;
}

.colorrow{display:flex;align-items:center;gap:12px;margin:8px 0 4px}
.colorrow input[type=color]{
  width:44px;height:44px;padding:0;border:1.5px solid var(--line);
  border-radius:8px;cursor:pointer;background:none;
}
.colorrow input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.colorrow input[type=color]::-webkit-color-swatch{border:0;border-radius:5px}
.settingsdivider{border:0;border-top:1px solid var(--line);margin:22px 0}

.activity{max-height:65vh;overflow:auto}
.activityrow{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:5px;
  padding:9px 2px;border-bottom:1px solid var(--line);
}
.activitywho{font-weight:600;color:var(--brand-text);font-size:14.5px}
.activitywhat{font-size:14.5px;color:var(--ink)}
.activitywhen{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}

main{max-width:960px;margin:0 auto;padding:var(--pad) var(--pad) 96px}

/* ---------- tabs ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabs.four{grid-template-columns:repeat(4,1fr)}
.tabs button{
  background:none;border:0;cursor:pointer;padding:11px 2px 13px;
  font-family:var(--sign);font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;font-size:13px;color:var(--muted);
  border-top:3px solid transparent;margin-top:-1px;
}
.tabs button[aria-current="true"]{color:var(--brand-text);border-top-color:var(--accent)}
.tabs .badge{
  font-family:var(--num);font-size:11px;letter-spacing:0;
  background:var(--brand);color:#fff;border-radius:99px;
  padding:1px 6px;margin-left:6px;vertical-align:1px;
}
@media (min-width:720px){
  .tabs,.tabs.four{
    position:static;grid-template-columns:repeat(4,max-content);
    border-top:0;border-bottom:1px solid var(--line);background:transparent;
    max-width:960px;margin:0 auto;padding:0 var(--pad);gap:4px;
  }
  .tabs button{border-top:0;border-bottom:3px solid transparent;padding:14px 16px;font-size:14px}
  .tabs button[aria-current="true"]{border-bottom-color:var(--accent)}
  main{padding-bottom:48px}
}

/* ---------- generic bits ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap{flex-wrap:wrap}
.row > input,.row > select,.row > textarea{min-width:0}
.spacer{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
h2.sign{font-size:22px;margin:26px 0 12px}
h2.sign:first-child{margin-top:0}

.btn{
  background:var(--brand);color:#fff;border:0;border-radius:8px;
  padding:11px 16px;cursor:pointer;font-weight:600;font-size:15px;
}
.btn:hover{background:var(--brand-deep)}
.btn.ghost{background:transparent;color:var(--brand-text);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--tint);border-color:var(--brand)}
.btn.quiet{background:none;color:var(--muted);padding:6px 8px;font-weight:500;font-size:14px;text-decoration:underline}
.btn.quiet:hover{color:var(--danger);background:none}
.btn.sm{padding:7px 11px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}

label.field{display:block;margin-bottom:12px}
label.field > span{
  display:block;font-family:var(--sign);font-weight:600;text-transform:uppercase;
  letter-spacing:.09em;font-size:13px;color:var(--muted);margin-bottom:5px;
}
input[type=text],input[type=email],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--card);border:1.5px solid var(--line);
  border-radius:8px;padding:10px 12px;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{min-height:110px;resize:vertical;line-height:1.5}

.notice{
  border-left:4px solid var(--accent);background:var(--tint-amber);
  padding:11px 14px;border-radius:0 8px 8px 0;font-size:14.5px;
}
.notice.bad{border-color:var(--danger);background:var(--tint-red)}

/* ---------- signage bar: the aisle header ---------- */
.aisle{
  display:flex;align-items:center;gap:12px;
  background:var(--brand-deep);color:#F2F7F3;
  padding:7px 12px;border-radius:6px;margin:22px 0 2px;
}
.aisle .name{font-family:var(--sign);font-weight:700;letter-spacing:.14em;font-size:15px;text-transform:uppercase}
.aisle .count{font-family:var(--num);font-size:12px;margin-left:auto;color:var(--accent)}

/* ---------- list control bar ---------- */
.listbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-bottom:6px;font-size:13.5px;
}
.listbar .spacer{flex:1;min-width:4px}
.unitpick{display:inline-flex;flex:none}
.unitpick select{
  width:auto;min-width:0;flex:none;
  padding:7px 30px 7px 11px;font-size:14px;
  border:1.5px solid var(--line);border-radius:8px;background:var(--card);
  font-family:var(--body);font-weight:500;
  color:var(--brand-text);cursor:pointer;
}
.unitpick select:hover{border-color:var(--brand)}
.sr{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ---------- receipt line with dotted leader ---------- */
.line{
  display:flex;align-items:center;gap:10px;
  padding:13px 4px;border-bottom:1px solid var(--line);
}
.line .tick{
  appearance:none;flex:none;width:23px;height:23px;margin:0;
  border:2px solid var(--brand);border-radius:5px;background:var(--card);
  cursor:pointer;position:relative;align-self:center;
}
.line .tick:checked{background:var(--brand);border-color:var(--brand)}
.line .tick:checked::after{
  content:"";position:absolute;left:6px;top:3px;width:6px;height:12px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg);
}
.line .what{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58%;
  font-size:16.5px;color:var(--ink);
}
.line .leader{
  flex:1;border-bottom:2px dotted #C3CCC1;
  transform:translateY(-3px);min-width:14px;
}
.line .qty{
  font-family:var(--num);white-space:nowrap;
  display:inline-flex;align-items:baseline;gap:6px;flex:none;
}
.line .qty b{
  font-weight:500;font-size:18px;color:var(--ink);letter-spacing:-.01em;
}
.line .qty i{
  font-style:normal;font-family:var(--sign);font-weight:600;
  text-transform:uppercase;letter-spacing:.09em;
  font-size:13.5px;color:var(--brand-text);
}
.line .qty .fr{font-style:normal;font-size:1.45em;line-height:0}
.line.done .what{color:var(--muted);text-decoration:line-through}
.line.done .qty b{color:var(--muted);text-decoration:line-through}
.line.done .qty i{color:var(--muted)}
.line.done .tick{opacity:.75}
.line .from{font-size:12px;color:var(--muted);white-space:nowrap}
.line .kill{
  background:none;border:0;color:var(--muted);cursor:pointer;
  font-size:18px;line-height:1;padding:0 2px;
}
.line .kill:hover{color:var(--danger)}

.tally{
  font-family:var(--num);font-size:13px;color:var(--ink);
  background:var(--tint-strong);border-radius:99px;padding:3px 11px;
}

/* ---------- week strip ---------- */
.weeknav{
  display:flex;align-items:center;gap:8px;margin-bottom:14px;
  flex-wrap:wrap;max-width:100%;
}
.weeknav .label{
  font-family:var(--sign);font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;font-size:15px;
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.weeknav .btn{flex:none;white-space:nowrap}
.weeknav .spacer{min-width:8px}
.weeknav .navarrow{
  flex:none;
  background:var(--card);border:1.5px solid var(--line);border-radius:8px;
  width:34px;height:34px;cursor:pointer;font-size:16px;line-height:1;
}
.weeknav .navarrow:hover{border-color:var(--brand)}

.days{display:grid;gap:10px}
@media (min-width:720px){.days{grid-template-columns:repeat(7,1fr);gap:8px}}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:96px}
.day.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.day .dow{font-family:var(--sign);font-weight:700;letter-spacing:.1em;font-size:13px;text-transform:uppercase;color:var(--brand-text)}
.day .dnum{font-family:var(--num);font-size:12px;color:var(--muted);margin-left:5px}
.meal{
  background:var(--tint);border-radius:6px;padding:6px 8px;margin-top:7px;
  font-size:13.5px;line-height:1.3;position:relative;
}
.meal .slot{font-family:var(--sign);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--brand-text)}
.meal .srv{font-family:var(--num);font-size:11px;color:var(--muted)}
.meal .kill{position:absolute;top:2px;right:4px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
.meal .kill:hover{color:var(--danger)}
.day .add{
  width:100%;margin-top:7px;background:none;border:1.5px dashed var(--line);
  border-radius:6px;padding:5px;cursor:pointer;color:var(--muted);font-size:13px;
}
.day .add:hover{border-color:var(--brand);color:var(--brand-text)}

/* ---------- recipe cards ---------- */
.recipes{display:grid;gap:10px}
@media (min-width:620px){.recipes{grid-template-columns:1fr 1fr}}
.recipe{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.recipe h3{margin:0 0 4px;font-size:17px;font-weight:600}
.recipe .meta{font-family:var(--num);font-size:12px;color:var(--muted)}
.pill{
  font-family:var(--sign);font-weight:600;text-transform:uppercase;letter-spacing:.09em;
  font-size:11px;padding:2px 7px;border-radius:99px;background:var(--tint);color:var(--brand-text);
}
.pill.pub{background:var(--accent);color:#3A2A05}

/* ---------- photos ---------- */
.shot{
  display:block;width:100%;aspect-ratio:4/3;object-fit:cover;
  background:#E4EAE3;border-radius:8px;
}
.recipe .shot{
  width:calc(100% + 30px);margin:-15px -15px 12px;
  border-radius:var(--r) var(--r) 0 0;
}
.pickphoto{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  background:transparent;color:var(--brand-text);border:1.5px solid var(--line);
  border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;
}
.pickphoto:hover{border-color:var(--brand);background:var(--tint)}
.pickphoto input{display:none}
.shotwrap{position:relative}
.shotwrap .busy{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(19,34,29,.55);color:#fff;border-radius:8px;
  font-family:var(--num);font-size:13px;
}

/* ---------- ingredient editor rows ---------- */
.ing{display:grid;grid-template-columns:1fr 88px 92px 32px;gap:6px;margin-bottom:6px;align-items:start}
.ing input,.ing select{padding:8px 9px}
.ing input.q{text-align:center}
.ing input.bad{border-color:var(--danger);background:#FCF1EE}
@media (max-width:520px){
  .ing{grid-template-columns:1fr 1fr;grid-template-areas:"n n" "q u" "d d"}
  .ing .n{grid-area:n}.ing .q{grid-area:q}.ing .u{grid-area:u}.ing .d{grid-area:d;justify-self:end}
}

/* ---------- ingredient parsing aids ---------- */
.paster{
  background:var(--card);border:1.5px solid var(--line);
  border-radius:var(--r);padding:12px;margin-bottom:14px;
}
.paster textarea{min-height:130px;font-size:15px}
.hint{
  display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;
  font-size:12.5px;margin:-2px 0 8px 2px;
}
.hint .ok{color:var(--brand-text)}
.hint .ok::before{content:"↳ "}
.hint .warn{color:var(--danger);font-weight:600}
.hint .swap{
  background:none;border:0;padding:0;cursor:pointer;font:inherit;
  color:var(--brand-text);text-decoration:underline;text-underline-offset:2px;
}
.hint .swap:hover{color:var(--brand-text)}
.hint .swap::before{content:"↳ "}
.hint .new{
  font-family:var(--sign);font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;font-size:11px;color:var(--tint-amber-text);
  background:var(--tint-amber);border-radius:99px;padding:1px 7px;
}

/* ---------- modal ---------- */
.veil{
  position:fixed;inset:0;background:rgba(19,34,29,.55);z-index:40;
  display:flex;align-items:flex-end;justify-content:center;padding:0;
}
@media (min-width:620px){.veil{align-items:center;padding:24px}}
.sheet{
  background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;
  border-radius:14px 14px 0 0;padding:18px var(--pad) calc(24px + env(safe-area-inset-bottom));
}
@media (min-width:620px){.sheet{border-radius:14px}}
.sheet.wide{max-width:1020px}
.sheet header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet header h3{margin:0;font-family:var(--sign);font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:19px}
.sheet header .x{margin-left:auto;background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--muted)}

/* ---------- cook view ---------- */
.cookhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.servebox{width:72px;text-align:center;font-family:var(--num);padding:7px}
.scaled{font-size:12.5px;color:var(--brand-text);background:var(--tint-strong);border-radius:99px;padding:3px 10px}
.cookshot{max-height:230px;margin-bottom:18px;aspect-ratio:auto}

.cook{display:grid;grid-template-columns:1fr;gap:22px}
@media (min-width:860px){
  .cook{grid-template-columns:minmax(280px,360px) 1fr;gap:28px;align-items:start}
  .cook .inglist{max-height:56vh;overflow:auto;padding-right:6px}
  .cook .steps{max-height:56vh;overflow:auto;padding-right:6px}
}
.cook .aisle{margin-top:0}

.cookline{
  display:flex;align-items:baseline;gap:10px;
  padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;
}
.cookline .tick{flex:none;align-self:center}
.cookline .amt{display:inline-flex;align-items:baseline;gap:4px;flex:none;min-width:58px}
.cookline .amt b{font-weight:500;font-size:16px;color:var(--ink)}
.cookline .amt i{
  font-style:normal;font-family:var(--sign);font-weight:600;font-size:12px;
  text-transform:uppercase;letter-spacing:.07em;color:var(--brand-text);
}
.cookline .amt .fr{font-style:normal;font-size:1.45em;line-height:0}
.cookline .ingname{font-size:15.5px;line-height:1.3}
.cookline .prep{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}
.cookline.done .ingname,.cookline.done .amt b{color:var(--muted);text-decoration:line-through}
.cookline.done .amt i{color:var(--muted)}

.steps{list-style:none;margin:0;padding:0}
.step{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.stepno{
  flex:none;width:29px;height:29px;border-radius:50%;cursor:pointer;
  border:2px solid var(--brand);background:var(--card);color:var(--brand-text);
  font-family:var(--num);font-size:13px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.stepno:hover{background:var(--tint-strong)}
.step .steptext{font-size:16px;line-height:1.45;cursor:pointer;padding-top:3px}
.step.done .stepno{background:var(--brand);border-color:var(--brand);color:#fff;font-size:15px}
.step.done .steptext{color:var(--muted);text-decoration:line-through}

/* ---------- ingredient suggestions ---------- */
.sugg{position:relative;margin-bottom:8px}
.sugg input{width:100%}
.sugglist{
  position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  box-shadow:0 10px 26px rgba(19,34,29,.14);overflow:hidden;
  max-height:280px;overflow-y:auto;
}
.suggitem{
  display:flex;align-items:baseline;gap:10px;width:100%;
  background:none;border:0;border-bottom:1px solid var(--line);
  padding:10px 12px;cursor:pointer;text-align:left;font:inherit;
}
.suggitem:last-child{border-bottom:0}
.suggitem:hover{background:var(--tint)}
.suggname{flex:1;font-size:15.5px;color:var(--ink)}
.suggaisle{
  font-family:var(--sign);font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;font-size:11px;color:var(--muted);
}
.suggnew{background:var(--tint-amber)}
.suggnew:hover{background:var(--tint-amber-hover)}
.suggnew .suggname{color:#5C4409}

.notice.quiet{border-color:var(--line);background:var(--tint)}

/* ---------- status buttons (used inside the pantry quick-edit sheet) ---------- */
.statusgroup{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.statusbtn{
  background:var(--card);border:0;border-right:1px solid var(--line);
  padding:9px 11px;cursor:pointer;font-family:var(--sign);font-weight:600;
  text-transform:uppercase;letter-spacing:.07em;font-size:12px;color:var(--muted);
}
.statusbtn:last-child{border-right:0}
.statusbtn:hover{background:var(--tint)}
.statusbtn.on{background:var(--status-plenty);color:#fff}
.statusbtn:nth-child(2).on{background:var(--status-low);color:#3A2A05}
.statusbtn:nth-child(3).on{background:var(--status-out);color:#fff}

.cook-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;margin-bottom:10px;
}
.cook-card.ready{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.cov{font-size:13px;color:var(--muted);background:var(--tint);border-radius:99px;padding:3px 10px}
.cov.full{background:var(--brand);color:#fff}

.stocktag{
  flex:none;font-family:var(--sign);font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;font-size:10.5px;padding:2px 7px;border-radius:99px;
  background:var(--tint-strong);color:var(--brand-text);
}
.stocktag.low{background:var(--tint-amber);color:var(--tint-amber-text)}
.line.stocked{opacity:.55}
.line.stocked .qty b{font-weight:400}
.tally.have{background:var(--tint-strong);color:var(--brand-text);margin-left:8px}
.cookline .prep.low{color:var(--tint-amber-text)}
.cookline .prep.out{color:var(--danger)}

/* ---------- segmented toggle (Chips/Table, etc.) ---------- */
.viewswap{
  display:inline-flex;border:1.5px solid var(--line);border-radius:8px;
  overflow:hidden;flex:none;background:var(--card);
}
.viewswap button{
  background:var(--card);border:0;border-right:1px solid var(--line);
  padding:9px 13px;cursor:pointer;font-family:var(--sign);font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);
  white-space:nowrap;
}
.viewswap button:last-child{border-right:0}
.viewswap button:hover{background:var(--tint)}
.viewswap button.on{background:var(--brand-deep);color:#fff}

/* ---------- pantry: table view ---------- */
.tablewrap{overflow-x:auto;margin:2px 0 6px;border:1px solid var(--line);border-radius:var(--r)}
.pantable{width:100%;border-collapse:collapse;font-size:14px}
.pantable thead th{
  text-align:left;font-family:var(--sign);font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;font-size:11px;color:var(--muted);
  padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;
  background:var(--tint);
}
.pantable td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.pantable tr:last-child td{border-bottom:0}
.pantable tbody tr{position:relative}
.pantable tbody tr::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--status-plenty);
}
.pantable tr.tr-low::before{background:var(--status-low)}
.pantable tr.tr-out::before{background:var(--status-out)}
.pantable tr:hover{background:var(--tint)}
.tblname{
  background:none;border:0;padding:0;font:inherit;font-weight:500;
  color:var(--ink);cursor:pointer;text-align:left;white-space:nowrap;
}
.tblname:hover{color:var(--brand-text);text-decoration:underline}
.tblqty{width:64px;padding:5px 7px;font-size:13.5px;text-align:center;font-family:var(--num)}
.tblunit{padding:5px 6px;font-size:13px;min-width:88px}
.tblwhen{white-space:nowrap;font-size:12px}
.tblstatusbtns{display:flex;gap:3px}
.tblstatusdot{
  width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);
  background:var(--card);color:var(--muted);cursor:pointer;
  font-family:var(--sign);font-weight:700;font-size:11px;line-height:1;
}
.tblstatusdot:hover{border-color:var(--brand)}
.tblstatusdot.plenty.on{background:var(--status-plenty);border-color:var(--status-plenty);color:#fff}
.tblstatusdot.low.on{background:var(--status-low);border-color:var(--status-low);color:#3A2A05}
.tblstatusdot.out.on{background:var(--status-out);border-color:var(--status-out);color:#fff}

/* ---------- pantry: buckets ---------- */
.bucket{
  border-radius:var(--r);transition:background-color .12s;
  padding:2px;margin:0 -2px;
}
.bucket.over{background:var(--tint-strong);outline:2px dashed var(--brand);outline-offset:-2px}

.bucketedit{
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  padding:12px;margin-bottom:16px;
}
.bucketeditrow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.bucketeditrow input{flex:1}

/* ---------- pantry: status chips ---------- */
.pchips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 6px}
.pchip{
  display:inline-flex;align-items:center;gap:7px;
  border:0;border-radius:99px;
  padding:9px 15px;cursor:pointer;font:inherit;
  background:var(--status-plenty);color:#fff;
  transition:transform .1s,opacity .1s;
}
.pchip.status-low{background:var(--status-low);color:#3A2A05}
.pchip.status-out{background:var(--status-out);color:#fff;opacity:.82}
.pchip:hover{transform:translateY(-1px)}
.pchip:active{transform:translateY(0)}
.pchip.dragging{opacity:.35}
.pchipname{font-size:15px;font-weight:500}
.pchiptag{
  font-family:var(--sign);font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;font-size:10.5px;opacity:.85;
}

/* ---------- pantry check ---------- */
.swipecount{text-align:center;margin:0 0 4px}
.swipestage{
  position:relative;height:190px;display:flex;
  align-items:center;justify-content:center;margin:10px 0 18px;
  touch-action:pan-y;
}
.swipecard{
  position:relative;width:100%;max-width:340px;height:180px;
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  box-shadow:0 10px 28px rgba(19,34,29,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:20px;cursor:grab;user-select:none;touch-action:none;
}
.swipecard:active{cursor:grabbing}
.swipename{font-size:22px;font-weight:600;text-align:center;line-height:1.25}
.swipemeta{font-size:13px;color:var(--muted)}
.swipewhen{
  font-family:var(--num);font-size:12px;color:var(--muted);
  margin-top:6px;background:var(--tint);border-radius:99px;padding:3px 10px;
}
.swipestamp{
  position:absolute;top:16px;font-family:var(--sign);font-weight:700;
  font-size:20px;letter-spacing:.05em;padding:4px 12px;border-radius:6px;
  border:3px solid;pointer-events:none;
}
.swipestamp.like{left:16px;color:var(--status-plenty);border-color:var(--status-plenty);transform:rotate(-14deg)}
.swipestamp.nope{right:16px;color:var(--status-out);border-color:var(--status-out);transform:rotate(14deg)}

.swipeactions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.swipebtn{
  border:0;border-radius:10px;padding:12px 6px;cursor:pointer;
  font-family:var(--sign);font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;font-size:12.5px;color:#fff;
}
.swipebtn.out{background:var(--status-out)}
.swipebtn.low{background:var(--status-low);color:#3A2A05}
.swipebtn.plenty{background:var(--status-plenty)}
.swipebtn:hover{opacity:.9}

.swipedone{text-align:center;padding:30px 10px}
.swipedoneicon{
  display:inline-flex;align-items:center;justify-content:center;
  width:56px;height:56px;border-radius:50%;background:var(--status-plenty);
  color:#fff;font-size:28px;margin-bottom:12px;
}
.swipedone p{margin:4px 0}

/* ---------- searchable recipe picker ---------- */
.picksearch{
  width:100%;background:var(--card);border:1.5px solid var(--line);
  border-radius:8px;padding:11px 13px;font-size:16px;
}
.picksearch:focus{border-color:var(--brand)}
.picklabel{font-size:12px;margin:12px 0 6px;letter-spacing:.09em}
.picklist{
  max-height:300px;overflow:auto;margin-top:8px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);
}
.pickitem{
  display:flex;align-items:center;gap:12px;width:100%;
  background:none;border:0;border-bottom:1px solid var(--line);
  padding:9px 11px;cursor:pointer;text-align:left;font:inherit;
}
.pickitem:last-child{border-bottom:0}
.pickitem.active{background:var(--tint)}
.pickitem.chosen{background:var(--tint-strong)}
.pickthumb{
  flex:none;width:48px;height:48px;border-radius:7px;object-fit:cover;
  background:#E4EAE3;display:block;
}
.pickthumb.blank{
  background:repeating-linear-gradient(45deg,#E9EEE8,#E9EEE8 6px,#E2E9E1 6px,#E2E9E1 12px);
}
.pickbody{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.picktitle{font-size:15.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickmeta{font-size:12px;color:var(--muted)}
.pickwhy{font-size:12px;color:var(--brand-text)}
.pickcheck{color:var(--brand-text);font-size:17px;flex:none}

/* ---------- adjusting one meal ---------- */
.adjust{padding-bottom:6px}
.adjrow{
  display:grid;grid-template-columns:1fr 84px 92px auto;gap:8px;
  align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);
}
.adjrow input,.adjrow select{padding:8px 9px}
.adjrow input{text-align:center}
.adjname{font-size:15.5px;line-height:1.25}
.adjrow.gone .adjname{color:var(--muted);text-decoration:line-through}
.adjrow.gone input,.adjrow.gone select{opacity:.45}
@media (max-width:560px){
  .adjrow{grid-template-columns:1fr 1fr;grid-template-areas:"n n" "q u" "d d"}
  .adjrow .adjname{grid-area:n}
  .adjrow input{grid-area:q}
  .adjrow select{grid-area:u}
  .adjrow button{grid-area:d;justify-self:end}
}

/* ---------- month calendar ---------- */
.monthwrap{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:860px){
  .monthwrap{grid-template-columns:1fr 260px;align-items:start}
}

.monthgrid{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.monthdow{
  display:grid;grid-template-columns:repeat(7,1fr);
  background:var(--brand-deep);color:#F2F7F3;
}
.monthdow span{
  padding:8px 4px;text-align:center;font-family:var(--sign);font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;
}
.monthcells{display:grid;grid-template-columns:repeat(7,1fr)}
.monthcell{
  aspect-ratio:1/1;min-height:52px;background:var(--card);border:0;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;padding:4px;position:relative;
}
.monthcells .monthcell:nth-child(7n){border-right:0}
.monthcell:hover{background:#F3F7F2}
.monthcell.out{background:var(--paper)}
.monthcell.out .mnum{color:#C7CDC5}
.monthcell.today .mnum{
  background:var(--brand-deep);color:#fff;border-radius:50%;
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
}
.monthcell.selected{background:var(--tint-strong);box-shadow:inset 0 0 0 2px var(--brand)}
.mnum{font-family:var(--num);font-size:13.5px;color:var(--ink)}
.mdots{display:flex;align-items:center;gap:4px;height:8px;font-size:0;line-height:0}
.mdots i{
  flex:none;display:inline-block;
  width:6px;height:6px;min-width:6px;min-height:6px;
  aspect-ratio:1/1;border-radius:50%;box-sizing:border-box;
  background:var(--brand);border:1.3px solid var(--brand);
}
.mdots i.hollow{background:transparent;border-color:#B9C2B6}

.daypanel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;
}
.daypanel h3{
  margin:0 0 10px;font-family:var(--sign);font-weight:700;letter-spacing:.03em;
  font-size:16px;color:var(--brand-text);
}
.daypanel .meal{margin-bottom:8px}

/* ---------- surprise me ---------- */
.surprise{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.reel{
  flex:1;min-width:160px;
  background:var(--brand-deep);color:#F2F7F3;border-radius:8px;
  padding:9px 14px;font-size:15px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background-color .2s;
}
.reel.spinning{
  color:#CFE0D6;
  animation:reelshake .12s linear infinite;
}
.reel.landed{
  background:var(--accent);color:#3A2A05;font-weight:700;
  animation:reelpop .35s ease-out;
}
@keyframes reelshake{
  0%{transform:translateY(0)}
  50%{transform:translateY(-1.5px)}
  100%{transform:translateY(0)}
}
@keyframes reelpop{
  0%{transform:scale(.96)}
  55%{transform:scale(1.03)}
  100%{transform:scale(1)}
}
@media (prefers-reduced-motion:reduce){
  .reel.spinning{animation:none}
  .reel.landed{animation:none}
}

/* ---------- requesting a meal ---------- */
.requester{
  background:var(--card);border:1.5px dashed var(--line);border-radius:var(--r);
  padding:14px 16px;margin-top:22px;
}
.reqcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;
}
.reqby{font-size:12.5px;color:var(--muted);white-space:nowrap}

/* ---------- cookie consent ----------
   A normal block right under the top bar, not fixed — the tab bar is
   already fixed to the bottom on mobile, and stacking two fixed bars
   there means one covers the other. This one just scrolls with the
   page, which for something shown once (or rarely, via "Cookies") is
   simpler and avoids that fight entirely. */
.consent{
  background:var(--brand-deep);color:#F2F7F3;
  padding:14px var(--pad);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.consent p{margin:0;font-size:13.5px;line-height:1.5;flex:1;min-width:220px}
.consent a{color:var(--accent)}
.consent .btn.ghost{
  color:#fff;border-color:rgba(255,255,255,.55);background:transparent;
}
.consent .btn.ghost:hover{background:rgba(255,255,255,.14);border-color:#fff}

/* ---------- clickable titles and meals ---------- */
.titlelink{
  background:none;border:0;padding:0;cursor:pointer;text-align:left;
  font:inherit;color:var(--ink);
}
.titlelink:hover{color:var(--brand-text);text-decoration:underline}
.mealopen{
  display:block;width:100%;background:none;border:0;padding:0;cursor:pointer;
  text-align:left;font:inherit;color:inherit;
}
.mealopen:hover .mealname{text-decoration:underline}
.meal .mealname{display:block}
.meal .slot{display:block}
.meal .srv{display:block}

/* ---------- gate ---------- */
.gate{max-width:400px;margin:8vh auto;padding:0 var(--pad)}
.gate .mark{font-family:var(--sign);font-weight:700;font-size:44px;text-transform:uppercase;letter-spacing:.01em;line-height:.95;margin-bottom:6px}
.gate .mark em{font-style:normal;color:var(--brand-text)}
.gate .tag{color:var(--muted);margin-bottom:24px}
.gate .card{padding:20px}
.or{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.gbtn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--card);border:1.5px solid var(--line);border-radius:8px;
  padding:11px;cursor:pointer;font-weight:600;
}
.gbtn:hover{border-color:var(--brand)}

.empty{text-align:center;color:var(--muted);padding:30px 12px}
.empty p{margin:0 0 14px}
.spin{text-align:center;color:var(--muted);padding:40px 0;font-family:var(--num);font-size:13px}
</style>
<script>
  // Runs before anything paints, so there's no flash of light mode
  // while waiting for app.js to load and mount. Deliberately plain,
  // synchronous script — not a module — so it can't be deferred.
  (function () {
    try {
      var saved = localStorage.getItem("sm-theme");
      var dark = saved
        ? saved === "dark"
        : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) { /* private mode, or matchMedia unsupported — default to light */ }
  })();
</script>
</head>
<body>
<div id="root"><div class="spin">Loading…</div></div>
<script type="module" src="./app.js"></script>
</body>
</html>
